version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: lofa-beauty-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lofa
      POSTGRES_PASSWORD: lofa_dev_password
      POSTGRES_DB: lofa_beauty
    ports:
      - "5432:5432"
    volumes:
      - lofa_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: lofa-beauty-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  lofa_postgres_data:
